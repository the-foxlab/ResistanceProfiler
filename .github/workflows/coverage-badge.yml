name: Coverage Badge

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: coverage-badge-${{ github.sha }}
  cancel-in-progress: true

jobs:
  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/backend/requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade 'genbadge[coverage]'

      - name: Run test suite with coverage
        run: pytest --cov=respro --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        run: genbadge coverage -i coverage.xml -o docs/docs/assets/coverage.svg

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update coverage badge [skip ci]'
          file_pattern: docs/docs/assets/coverage.svg
