name: Dependency Review

on:
  pull_request:
    branches:
      - master
    paths:
      - 'pyproject.toml'
      - 'web/backend/requirements.txt'
      - 'web/frontend/package.json'
      - 'web/frontend/package-lock.json'
      - 'bioconda/recipes/respro/meta.yaml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review changed dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the PR when a new dependency introduces a known vulnerability
          # at or above moderate severity. License checks are left to the
          # default behaviour to avoid false positives on scientific packages
          # whose SPDX identifiers (e.g. matplotlib's PSF-based license) are
          # not always stable across registries.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
