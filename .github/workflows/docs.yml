name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/manual/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy manual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build example report for /example-report/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/project_databases
          DB_NAME="herpesdrg"
          respro databases --download "$DB_NAME" --no-additional-info --output "data/project_databases/${DB_NAME}.db"
          respro vcf \
            --project "data/project_databases/${DB_NAME}.db" \
            --vcf example_data/example_vcf.vcf \
            --ref-fasta example_data/vcf_reference.fasta \
            --sample example_data \
            --output "docs/manual/docs/example-report/index.html"
          test -s docs/manual/docs/example-report/index.html

      - name: Deploy to GitHub Pages
        working-directory: docs/manual
        run: mkdocs gh-deploy --force
