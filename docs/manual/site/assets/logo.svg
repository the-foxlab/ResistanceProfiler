<svg width="480" height="110" viewBox="0 0 480 110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t { font-family: Arial, Helvetica, sans-serif; font-size: 34px; }
  </style>

  <!-- Alignment blocks -->
  <g transform="translate(20,55)">
    <rect x="0"  y="-18" width="40" height="8" fill="#45577e" stroke="white" stroke-width="1"/>
    <rect x="10" y="-6"  width="40" height="8" fill="#0f766e" stroke="white" stroke-width="1"/>
    <rect x="5"  y="6"   width="40" height="8" fill="#45577e" stroke="white" stroke-width="1"/>
    <rect x="15" y="18"  width="40" height="8" fill="#45577e" stroke="white" stroke-width="1"/>
  </g>

  <!-- Shifted box -->
  <rect x="90" y="30" width="185" height="52" fill="#0f766e" rx="6"/>

  <!-- Text -->
  <text x="100" y="67" class="t" fill="white">Resistance</text>
  <text x="280" y="67" class="t" fill="#45577e" stroke="white" stroke-width="2" paint-order="stroke fill">Profiler</text>
</svg>