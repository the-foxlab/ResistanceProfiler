[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'respro'
version = '0.1.0'
description = 'Pathogen-agnostic framework for genotypic antiviral resistance profiling from NGS-derived variants.'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.11'
authors = [
    {name = 'Fuchs J'},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = [
    'click>=8.1',
    'numpy>=1.24',
    'pandas>=2.0',
    'biopython>=1.81',
    'jinja2>=3.1',
    'matplotlib>=3.7',
]

[project.optional-dependencies]
app = ['shiny', 'shinywidgets', 'plotly']
ml = ['scikit-learn>=1.3', 'scipy>=1.11']
dev = ['pytest>=7.4', 'pytest-cov>=4.1', 'ruff>=0.1']

[project.scripts]
respro = 'respro.cli:main'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-v --tb=short'

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP']

