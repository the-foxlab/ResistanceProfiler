[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'respro'
version = '0.1.0'
description = 'Pathogen-agnostic framework for genotypic antiviral resistance profiling from SANGER or NGS-derived variants.'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.11'
authors = [
    {name = 'Jonas Fuchs', email = 'jonas.fuchs@uniklinik-freiburg.de'},
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    'click>=8.1',
    'numpy>=1.24',
    'biopython>=1.81',
    'jinja2>=3.1.5',
    'markupsafe>=2.1',
    'matplotlib>=3.7',
]

[project.optional-dependencies]
dev = ['pytest>=7.4', 'pytest-cov>=4.1', 'ruff>=0.1']

[project.scripts]
respro = 'respro.cli:main'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-v --tb=short'

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP']
extend-ignore = ['E501']  # line length enforced by editor convention, not CI

[tool.hatch.build]
include = [
    'respro/**/*.py',
    'respro/report/templates/*.j2',
    'respro/report/static/*.css',
    'respro/report/static/*.js',
    'respro/report/static/*.svg',
]

