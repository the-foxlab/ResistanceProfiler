[timeouts]
pubchem = 5
pubmed = 5
crossref = 5

[urls]
pubchem_compound_page = 'https://pubchem.ncbi.nlm.nih.gov/compound/{cid}'
pubchem_structure_png = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{cid}/PNG'
pubchem_cid_lookup = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/{name}/cids/JSON'
pubchem_description = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{cid}/description/JSON'
pubchem_title = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/{cid}/property/Title/JSON'
ncbi_pubmed_esummary = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id={pmid}&retmode=json'
ncbi_pmc_idconv = 'https://www.ncbi.nlm.nih.gov/pmc/utils/idconv/v1.0/?ids={identifier}&format=json'
crossref_works = 'https://api.crossref.org/works/{doi}'
ncbi_protein_page = 'https://www.ncbi.nlm.nih.gov/protein/{protein_id}/'
ncbi_nuccore_efetch = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id={accession}&rettype=gb&retmode=text'
github_respro_db_raw = 'https://raw.githubusercontent.com/the-foxlab/respro-databases/main/databases'

[parsing]
doi_prefixes = ['https://doi.org/', 'http://doi.org/']

[matching]
combination_member_af_threshold = 0.75

[similarity]
# BLOSUM62 score thresholds for amino-acid similarity classification.
# score >= high      → 'high'
# score >= moderate  → 'moderate'
# score < moderate   → 'low'
high     = 1
moderate = 0

[af_bins]
# Allele-frequency classification bins for VCF-mode profiling.
# Each value is [lower_inclusive, upper_inclusive].
high         = [0.75, 1.0]
intermediate = [0.25, 0.7499]
low          = [0.01, 0.2499]

[af_bins_fasta]
# Allele-frequency classification bins for FASTA-mode profiling.
# FASTA frequencies are discrete (1.0, 0.5, 0.33, 0.25) due to IUPAC base expansion,
# so bin boundaries are adjusted to reflect these values cleanly.
high         = [0.75, 1.0]
intermediate = [0.35, 0.74]
low          = [0.01, 0.34]

[alignment]
# Minimap2/mappy alignment settings for CDS-to-query mapping.
# Tuned for sensitivity across divergent sequences (~60–75% identity).
preset = 'map-ont'
k = 6
w = 3
best_n = 1
# Short-gap open penalty passed to mappy as the O1 component of the scoring tuple.
# map-ont default is 4; raising to 6 suppresses compensating indel pairs (adjacent
# I/D in CIGAR that represent a single divergence event) without losing real indels.
gap_open_penalty = 6
# Scoring tuple components (A, B, O1, E1, O2, E2) passed to mappy.
# These are map-ont preset defaults from minimap2.
# See: https://github.com/lh3/minimap2/blob/master/main.cs
# Only change these if you understand minimap2 scoring; wrong values can
# degrade alignment quality for divergent sequences.
match_score = 2
mismatch_penalty = 4
gap_extension_penalty_1 = 2
gap_open_penalty_2 = 24
gap_extension_penalty_2 = 1
# Maximum CDS-position distance (in nt) between a CIGAR `I` op and a known
# exon-junction offset for the `I` op to be classified as an intron rather
# than a coding insertion. Only applies to features with >1 segment (spliced
# CDS). mappy may place the junction a few nt off the stored segment boundary,
# so a small tolerance accommodates soft clipping near exon edges without
# classifying real in-exon insertions as introns.
intron_junction_tolerance = 5
