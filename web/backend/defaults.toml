[env]
data_dir = 'RESPRO_WEB_DATA_DIR'
allowed_roots = 'RESPRO_WEB_ALLOWED_ROOTS'
cors_origins = 'RESPRO_WEB_CORS_ORIGINS'
upload_rate_limit = 'RESPRO_WEB_UPLOAD_RATE_LIMIT'
api_rate_limit = 'RESPRO_WEB_API_RATE_LIMIT'
max_batch_size = 'RESPRO_WEB_MAX_BATCH_SIZE'
host = 'RESPRO_WEB_HOST'
port = 'RESPRO_WEB_PORT'
redis_url = 'REDIS_URL'
job_timeout = 'RESPRO_WEB_JOB_TIMEOUT'
job_retry_max = 'RESPRO_WEB_JOB_RETRY_MAX'
job_retry_intervals = 'RESPRO_WEB_JOB_RETRY_INTERVALS'
maintained_bootstrap = 'RESPRO_WEB_MAINTAINED_BOOTSTRAP'
maintained_db_update_interval = 'RESPRO_WEB_MAINTAINED_DB_UPDATE_INTERVAL_SECONDS'
trusted_proxies = 'RESPRO_WEB_TRUSTED_PROXIES'
imprint = 'RESPRO_WEB_IMPRINT'
contact_email = 'RESPRO_WEB_CONTACT_EMAIL'
deployment_mode = 'RESPRO_WEB_DEPLOYMENT_MODE'
result_ttl = 'RESPRO_WEB_RESULT_TTL'
session_ttl = 'RESPRO_WEB_SESSION_TTL'

[defaults]
web_host = '127.0.0.1'
web_port = 8000
redis_url = 'redis://127.0.0.1:6379/0'
job_timeout_seconds = 3600
job_retry_max = 0
job_retry_intervals_seconds = [30]
sweep_frequency_seconds = 3600
upload_rate_limit = '25/minute'
api_rate_limit = '120/minute'
max_batch_size = 25
artifact_bundle_max_paths = 50
# Upper bound for the --threads worker argument and max lengths for string/list
# fields on API request models. These cap abuse surface area while staying well
# above legitimate use.
profile_max_threads = 4
sample_name_max_length = 128
display_name_max_length = 128
path_list_max_length = 256
# Upper bound for opaque upload/artifact/job IDs and database lookup strings on
# API request models. Generated IDs are ~22 chars; this caps abuse surface area.
opaque_id_max_length = 256
# Upper bound for the min_depth coverage cutoff on VCF profiling requests.
min_depth_max = 1000000
batch_queue_name = 'profiling'
cors_local_origins = ['http://127.0.0.1:5173', 'http://localhost:5173']
profile_queue_name = 'profiling'
frontend_base_path = '/'
service_name = 'respro-web-api'
maintained_bootstrap = false
maintained_db_update_interval_seconds = 604800
# Deployment trust model: 'local' (default; zero-config, docs enabled, loopback),
# 'online' (behind a reverse proxy; requires RESPRO_WEB_TRUSTED_PROXIES; docs
# disabled). Browser auth is configured at the proxy, not here.
deployment_mode = 'local'
# Time-to-live in seconds for files in uploads/ and results/ AND for RQ job
# metadata (ttl/result_ttl/failure_ttl). A background sweep thread deletes files
# older than this value, and RQ job records (which can contain sample names,
# absolute paths, and exception output) expire after the same duration.
result_ttl_seconds = 86400
# Time-to-live in seconds for anonymous session records in Redis. Sessions are
# additive in local mode (no auth required) and become the ownership boundary
# for uploads/jobs/artifacts in non-local modes. Defaults to 7 days so a user
# who returns within a week keeps their session; records expire automatically.
session_ttl_seconds = 604800

[defaults.profile]
sample_name = 'sample'
threads = 1
min_af = 0.01
min_depth = 10

[defaults.upload]
max_fasta_size = 5242880
max_vcf_size = 1048576
max_bam_size = 1073741824
chunk_size = 1048576
max_fasta_line_length = 500000
max_vcf_line_length = 100000
max_vcf_data_lines = 2000000
bgzf_header_bytes = 18
allowed_fasta_types = ['text/plain', 'application/octet-stream']
allowed_vcf_types = ['text/plain', 'text/x-vcf', 'application/octet-stream']
allowed_bam_types = ['application/octet-stream']
