<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResistanceProfiler Web</title>
    <script>
      // Apply the theme before first paint to avoid a light flash on dark
      // systems. Mirrors the resolution logic in hooks/useTheme.js: stored
      // 'light'/'dark' wins; otherwise follow prefers-color-scheme.
      (function () {
        try {
          var stored = localStorage.getItem('respro-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
