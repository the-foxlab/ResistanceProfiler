# =============================================================================
# ResistanceProfiler — web app stack (reference compose file)
# =============================================================================
# This file is the canonical reference. The active settings below are the
# minimal zero-config set: `docker compose -f docker-compose.web.yml up --build`
# works with no edits and serves the app on http://127.0.0.1:8000.
#
# Every optional and security-relevant setting is present but `#`-commented,
# grouped by category. Uncomment and edit the ones you need for public hosting.
# See docs/docs/webapp.md → "Production hosting checklist" before going live.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ── Redis authentication ───────────────────────────────────────────────
    # Redis is an execution trust boundary: RQ's default serializer uses pickle,
    # so anything able to write to Redis can achieve worker code execution. The
    # reference stack therefore requires a password by default. Set
    # RESPRO_REDIS_PASSWORD to a strong secret (generate one with, e.g.:
    #   python -c "import secrets; print(secrets.token_urlsafe(32))"
    # For local zero-config startup on loopback only, set RESPRO_REDIS_PASSWORD
    # to any non-empty value (even a simple one) — the goal is to prevent
    # anonymous writes from other processes on the network.
    command: ["sh", "-c", "exec redis-server --requirepass \"$${RESPRO_REDIS_PASSWORD:?RESPRO_REDIS_PASSWORD must be set — see docs/docs/webapp.md#redis-and-job-queue}\""]
    environment:
      # Set this in your .env file or environment. Uncomment the line below to
      # use a fixed local-dev password for zero-config loopback startup:
      - RESPRO_REDIS_PASSWORD=${RESPRO_REDIS_PASSWORD:-change-me-local-only}

  respro-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: respro-web:latest
    # Bind to loopback only by default so the zero-config stack is
    # not exposed to the LAN/public interface. Single-command local startup
    # (`docker compose -f docker-compose.web.yml up --build`) is unaffected because
    # loopback is reachable from the same host. For public hosting, place a
    # reverse proxy (Nginx/SSO) in front and set RESPRO_WEB_DEPLOYMENT_MODE=online
    # with RESPRO_WEB_TRUSTED_PROXIES and RESPRO_WEB_CORS_ORIGINS
    # (see docs/docs/webapp.md).
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./data:/data:rw
    #env_file:
    #  - .env
    environment:
      # ── Server and binding ─────────────────────────────────────────────────
      - RESPRO_WEB_HOST=0.0.0.0
      - RESPRO_WEB_PORT=8000
      # ── Data and filesystem ────────────────────────────────────────────────
      # - RESPRO_WEB_DATA_DIR=/data
      # - RESPRO_WEB_ALLOWED_ROOTS=/data/project_databases,/data/uploads,/data/results
      # - RESPRO_WEB_RESULT_TTL=86400
      # ── Deployment mode and security (REQUIRED for public hosting) ─────
      # - RESPRO_WEB_DEPLOYMENT_MODE=online
      # - RESPRO_WEB_CORS_ORIGINS=https://respro.example.com
      # - RESPRO_WEB_TRUSTED_PROXIES=127.0.0.1
      # ── Rate limiting and batch sizes ──────────────────────────────────────
      # - RESPRO_WEB_UPLOAD_RATE_LIMIT=25/minute
      # - RESPRO_WEB_API_RATE_LIMIT=120/minute
      # - RESPRO_WEB_MAX_BATCH_SIZE=25
      # ── Redis and job queue (set identically on respro-worker) ─────────────
      # REDIS_URL includes the Redis password (must match RESPRO_REDIS_PASSWORD
      # on the redis service). The default below uses the same env var so the
      # zero-config stack works out of the box on loopback.
      - REDIS_URL=redis://:${RESPRO_REDIS_PASSWORD:-change-me-local-only}@redis:6379/0
      # For a strong secret in production, set RESPRO_REDIS_PASSWORD in your env
      # or .env file; the URL below picks it up automatically.
      # - RESPRO_WEB_JOB_TIMEOUT=3600
      # - RESPRO_WEB_JOB_RETRY_MAX=0
      # - RESPRO_WEB_JOB_RETRY_INTERVALS=30
      # ── Maintained databases ───────────────────────────────────────────────
      - RESPRO_WEB_MAINTAINED_BOOTSTRAP=true
      # - RESPRO_WEB_MAINTAINED_DB_UPDATE_INTERVAL_SECONDS=604800
      # ── Optional legal notice / imprint ────────────────────────────────────
      # Either an absolute URL to an already-hosted imprint page:
      # - RESPRO_WEB_IMPRINT=https://example.org/impressum
      # …or an absolute path to a local HTML file served at /legal:
      # - RESPRO_WEB_IMPRINT=/data/imprint.html
      # ── Optional contact e-mail (footer + About tab) ───────────────────────
      # - RESPRO_WEB_CONTACT_EMAIL=contact@example.org
    depends_on:
      - redis

  respro-worker:
    image: respro-web:latest
    command: sh -c "exec python -m web.backend.worker"
    volumes:
      - ./data:/data:rw
      # Only needed for path-mode imprint (self-hosted HTML):
      # - ./imprint.html:/data/imprint.html:ro
    environment:
      # ── Redis and job queue (must match respro-web) ────────────────────────
      - REDIS_URL=redis://:${RESPRO_REDIS_PASSWORD:-change-me-local-only}@redis:6379/0
      # - RESPRO_WEB_JOB_TIMEOUT=3600
      # - RESPRO_WEB_JOB_RETRY_MAX=0
      # - RESPRO_WEB_JOB_RETRY_INTERVALS=30
    depends_on:
      - redis
