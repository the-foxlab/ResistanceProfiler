services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  respro-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: respro-web:latest
    ports:
      - '0.0.0.0:8000:8000'
    volumes:
      - ./data:/data:rw
    environment:
      - RESPRO_WEB_HOST=0.0.0.0
      - RESPRO_WEB_PORT=8000
      - RESPRO_WEB_MAINTAINED_BOOTSTRAP=true
      - REDIS_URL=redis://redis:6379/0
      # Optional legal notice / imprint. Either an absolute URL to an already-hosted
      # imprint page (footer links directly to it)…
      # - RESPRO_WEB_IMPRINT=https://example.org/impressum
      # …or an absolute path to a local HTML file served at /legal (mount it below):
      # - RESPRO_WEB_IMPRINT=/data/imprint.html
    depends_on:
      - redis

  respro-worker:
    image: respro-web:latest
    command: rq worker --url redis://redis:6379/0 profiling
    volumes:
      - ./data:/data:rw
      # Only needed for path-mode imprint (self-hosted HTML):
      # - ./imprint.html:/data/imprint.html:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
